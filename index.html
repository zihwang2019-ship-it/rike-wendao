<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日课问道</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: a hanging scroll. The painting sits on top with a vertical inscription and a seal;
     the ledger of the day scrolls beneath it; a rail of four tabs closes the bottom.
     Palette follows the real clock: mineral pigments on indigo at night, on aged silk by day. */
  --bg:#0e1b29; --surface:#15283a; --line:#2b4459; --ink:#ebe3cf; --muted:#93a4ae;
  --azurite:#4a93c4; --malachite:#45ab8f; --gold:#d6ad55; --cinnabar:#d65f44; --on-accent:#0d1924;
  --sky1:#091420; --sky2:#1a3350; --m1:#234c6b; --m2:#1c5b72; --m3:#1b6a5d; --m4:#0f3540;
  --f-brush:"Ma Shan Zheng","STKaiti","KaiTi","Kaiti SC",cursive;
  --f-head:"ZCOOL XiaoWei","Songti SC","STSong","Noto Serif CJK SC",serif;
  --f-body:"Noto Serif SC","Songti SC","STSong","Noto Serif CJK SC","SimSun",serif;
  color-scheme:dark;
}
:root[data-phase="day"]{
  --bg:#dbcfae; --surface:#e8dec3; --line:#bdab80; --ink:#1c2a31; --muted:#566360;
  --azurite:#1f5f8b; --malachite:#1d6352; --gold:#775711; --cinnabar:#a53d28; --on-accent:#f4eedc;
  --sky1:#e9dfc4; --sky2:#d6c8a0; --m1:#86a8b8; --m2:#3f7f9c; --m3:#2f8271; --m4:#1f5a55;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;
  display:flex;justify-content:center;-webkit-text-size-adjust:100%;transition:background-color .8s,color .8s}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;position:relative}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3,p,ol,ul,dl,dd{margin:0;padding:0}
ol,ul{list-style:none}

/* painting */
.hero{position:relative;flex:none;height:clamp(204px,28vh,244px);overflow:hidden;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#scene{display:block;width:100%;height:100%}
.inscr{position:absolute;top:14px;left:16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.inscr h1{writing-mode:vertical-rl;font-family:var(--f-brush);font-weight:400;font-size:36px;line-height:1;
  letter-spacing:.06em;text-shadow:0 0 14px var(--sky1),0 0 4px var(--sky1)}
.seal{width:26px;height:26px;display:grid;place-items:center;background:var(--cinnabar);color:#f6ead6;
  font-family:var(--f-head);font-size:16px;line-height:1;border-radius:3px;transform:rotate(-3deg)}
.colophon{position:absolute;top:14px;right:16px;text-align:right;font-family:var(--f-head);line-height:1.5;
  text-shadow:0 0 10px var(--sky1),0 0 3px var(--sky1)}
.colophon .dao{font-size:17px}
.colophon .hour{font-size:13px;color:var(--muted)}
.colophon .stones{font-size:13px;font-variant-numeric:tabular-nums}
.colophon .stones b{font-weight:400;color:var(--gold)}

/* cultivation gauge */
.gauge{flex:none;padding:10px 16px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.gauge-row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-variant-numeric:tabular-nums}
.gauge-row .xp{font-family:var(--f-head);font-size:15px}
.gauge-row .xp b{font-weight:400;font-size:19px}
.gauge-row .rate{font-size:13px;color:var(--malachite)}
.bar{height:7px;border:1px solid var(--line);border-radius:4px;overflow:hidden;
  background:repeating-linear-gradient(90deg,transparent 0,transparent calc(25% - 1px),var(--line) calc(25% - 1px),var(--line) 25%)}
.bar i{display:block;height:100%;width:0;background:var(--malachite);transition:width .9s linear}
.bar.full i{background:var(--gold)}
.note{font-size:12.5px;color:var(--muted);min-height:34px;display:flex;align-items:center}

/* controls */
.btn{border:1px solid var(--line);background:transparent;border-radius:6px;padding:7px 14px;font-family:var(--f-head);
  font-size:14px;line-height:1.3;white-space:nowrap;min-height:34px}
.btn.pri{background:var(--azurite);border-color:var(--azurite);color:var(--on-accent)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-accent)}
.btn.warn{border-color:var(--cinnabar);color:var(--cinnabar)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gold.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--gold) 22%,transparent)}}
input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:0;width:100%}

/* ledger */
#panel{flex:1;overflow-y:auto;padding:14px 16px 22px;display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--f-head);font-weight:400;font-size:17px;letter-spacing:.08em;display:flex;align-items:baseline;gap:10px}
h2 small{font-family:var(--f-body);font-size:12.5px;color:var(--muted);letter-spacing:0;font-variant-numeric:tabular-nums}
.sec{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:1px 9px;border:1px solid var(--line);border-radius:999px;font-variant-numeric:tabular-nums}
.chip.up{border-color:var(--malachite);color:var(--malachite)}
.chip.down{border-color:var(--cinnabar);color:var(--cinnabar)}
.callout{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 12px;
  border:1px solid var(--gold);border-radius:8px;font-size:14px}
.log{display:flex;flex-direction:column}
.log li{display:grid;grid-template-columns:5.4em 1fr;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.log time{font-size:12px;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.log p{font-size:14.5px}
.log li.key p{color:var(--gold)}
.log li.bad p{color:var(--cinnabar)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{font-family:var(--f-head);font-weight:400;font-size:19px;letter-spacing:.06em}
.card .story{font-size:15px;line-height:1.85}
.card .picked{font-size:13px;color:var(--muted)}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;border:1px solid var(--line);background:transparent;border-radius:8px;padding:9px 12px;
  display:flex;flex-direction:column;gap:1px;line-height:1.5}
.choice:not(:disabled):active{background:color-mix(in srgb,var(--azurite) 18%,transparent)}
.choice span{font-size:15px}
.choice small{font-size:12px;color:var(--muted)}
.choice:disabled{opacity:.5;cursor:not-allowed}
.gains{display:flex;flex-wrap:wrap;gap:6px}
.empty{color:var(--muted);font-size:14px}

.habits{display:flex;flex-direction:column}
.habit{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.habit .txt{display:flex;flex-direction:column;min-width:0;line-height:1.45}
.habit b{font-family:var(--f-head);font-weight:400;font-size:17px}
.habit span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.habit .mark{width:34px;height:34px;display:grid;place-items:center;background:var(--cinnabar);color:#f6ead6;
  font-family:var(--f-head);border-radius:4px;transform:rotate(-4deg);flex:none}
.habit.edit{display:grid;grid-template-columns:5.5em 1fr auto;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.row .txt{display:flex;flex-direction:column;min-width:0;line-height:1.45}
.row b{font-weight:400;font-family:var(--f-head);font-size:16px;font-variant-numeric:tabular-nums}
.row span{font-size:12.5px;color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.row .acts{flex:none;flex-wrap:nowrap;align-items:center}
.hint{font-size:12.5px;color:var(--muted)}

/* tab rail */
.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--bg)}
.tabs button{border:0;background:transparent;padding:9px 4px 11px;font-family:var(--f-head);font-size:15px;letter-spacing:.08em;
  color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.3;border-top:2px solid transparent;margin-top:-1px}
.tabs button[aria-selected=true]{color:var(--ink);border-top-color:var(--gold)}
.tabs small{font-family:var(--f-body);font-size:11px;letter-spacing:0;font-variant-numeric:tabular-nums;min-height:1.3em}
.tabs small.hot{color:var(--gold)}

/* sheet */
#sheet{position:absolute;inset:0;background:rgba(5,10,16,.55);display:flex;align-items:flex-end;z-index:5}
#sheet[hidden]{display:none}
.sheet-body{width:100%;background:var(--bg);border-top:1px solid var(--gold);border-radius:14px 14px 0 0;padding:20px 18px 22px;
  display:flex;flex-direction:column;gap:12px;animation:rise .28s ease-out}
.sheet-body h3{font-family:var(--f-brush);font-weight:400;font-size:32px;line-height:1.2}
.sheet-body ul{display:flex;flex-direction:column;gap:2px;font-size:15px;font-variant-numeric:tabular-nums}
@keyframes rise{from{transform:translateY(24px);opacity:.4}}

/* breathing, spirit orbs, floating gains */
#tapHint{position:absolute;right:16px;bottom:22px;font-size:12px;color:#f3ecd8;text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none}
.orb{position:absolute;width:22px;height:22px;padding:0;border:0;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,#fff8e0 0,var(--gold) 46%,transparent 72%);
  box-shadow:0 0 14px 4px color-mix(in srgb,var(--gold) 55%,transparent);animation:orb 1.8s ease-in-out infinite}
.orb::after{content:"";position:absolute;inset:-12px}
@keyframes orb{50%{transform:translate(-50%,-62%) scale(1.14)}}
.float{position:absolute;pointer-events:none;transform:translate(-50%,-100%);white-space:nowrap;font-family:var(--f-head);font-size:14px;
  color:#f6ead6;text-shadow:0 1px 3px rgba(0,0,0,.75);animation:floatUp 1s ease-out forwards;font-variant-numeric:tabular-nums}
.float.big{font-size:16px;color:#ffe7a3}
@keyframes floatUp{to{transform:translate(-50%,-250%);opacity:0}}
/* segmented control inside 洞府 */
.seg{position:sticky;top:-14px;z-index:2;background:var(--bg);display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;padding:7px 0;font-family:var(--f-head);font-size:15px;letter-spacing:.08em;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:inset 0 -2px 0 var(--gold)}
.group{font-family:var(--f-head);font-size:13px;color:var(--muted);letter-spacing:.2em;padding-top:8px}
.bar.hp i{background:var(--cinnabar);transition:width .3s}
.row .mark{width:30px;height:30px;display:grid;place-items:center;background:var(--cinnabar);color:#f6ead6;font-family:var(--f-head);
  font-size:15px;border-radius:4px;transform:rotate(-4deg);flex:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="hero">
    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="inscr"><h1 id="realm">炼气一层</h1><span class="seal" id="seal" title="灵根">火</span></div>
    <div class="colophon">
      <div class="dao" id="daoName"></div>
      <div class="hour" id="hourName"></div>
      <div class="stones">灵石 <b id="stones">0</b></div>
    </div>
    <div id="tapHint"></div>
  </header>
  <section class="gauge" aria-label="修为">
    <div class="gauge-row">
      <span class="xp">修为 <b id="xpNow">0</b> / <span id="xpReq">0</span></span>
      <span class="rate" id="rate"></span>
    </div>
    <div class="bar" id="barWrap"><i id="bar"></i></div>
    <div class="gauge-row">
      <span class="note" id="note"></span>
      <button class="btn" id="boostBtn" type="button"></button>
      <button class="btn gold pulse" id="breakBtn" type="button" hidden></button>
    </div>
  </section>
  <main id="panel"></main>
  <nav class="tabs" role="tablist" aria-label="页签">
    <button type="button" role="tab" data-tab="xiu">修行<small id="tXiu"></small></button>
    <button type="button" role="tab" data-tab="ke">日课<small id="tKe"></small></button>
    <button type="button" role="tab" data-tab="yuan">机缘<small id="tYuan"></small></button>
    <button type="button" role="tab" data-tab="zong">宗门<small id="tZong"></small></button>
    <button type="button" role="tab" data-tab="fu">洞府<small id="tFu"></small></button>
  </nav>
  <div id="sheet" hidden role="dialog" aria-modal="true"><div class="sheet-body" id="sheetBody"></div></div>
</div>

<script>
(function(){
'use strict';
/* ---------- constants ---------- */
const V=1, FMT=2, LS_KEY='rike-wendao-v1';
const MIN=60e3, HOUR=3600e3, DAY=24*HOUR, FATE_INT=30*MIN, FATE_CAP=3, FATE_MAX=6;
const BRANCH=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const BRANCH_ALIAS=['夜半','鸡鸣','平旦','日出','食时','隅中','日中','日昳','晡时','日入','黄昏','人定'];
const CARDINAL=[0,3,6,9]; // 子午卯酉，四正时
const ROOTS={
  '金':{br:[8,9],bonus:.25,when:'申酉二时'},
  '木':{br:[2,3],bonus:.25,when:'寅卯二时'},
  '水':{br:[11,0],bonus:.25,when:'亥子二时'},
  '火':{br:[5,6],bonus:.25,when:'巳午二时'},
  '土':{br:[1,4,7,10],bonus:.12,when:'辰戌丑未四时'}
};
const GRADES=[{n:'杂灵根',m:1,w:50},{n:'真灵根',m:1.15,w:35},{n:'天灵根',m:1.35,w:13},{n:'变异灵根',m:1.6,w:2}];
const REALMS=['炼气','筑基','金丹','元婴','化神','炼虚','合体','大乘'];
const STAGES=[];
REALMS.forEach((r,ri)=>{
  const subs=ri===0?['一层','二层','三层','四层','五层','六层','七层','八层','九层']:['初期','中期','后期','圆满'];
  subs.forEach((s,si)=>STAGES.push({name:r+s,ri,last:si===subs.length-1}));
});
const DEFAULT_HABITS=[
  {id:'h1',name:'炼体',desc:'运动 30 分钟'},
  {id:'h2',name:'悟道',desc:'读书或学习 30 分钟'},
  {id:'h3',name:'入世',desc:'做完今天最要紧的一件事'},
  {id:'h4',name:'静心',desc:'冥想或放空 10 分钟'}
];
const AMBIENT=['山风过耳，你运转完一个周天。','檐角滴水，一息一数，数到后来忘了数。','远处有人练剑，剑鸣断断续续。',
  '香炉里的灰又积了一层。','一只山雀落在窗台，看了你一会儿，飞走了。','丹田微热，灵气如溪水缓缓汇入。'];
const SECTS=['青岚宗','太虚门','云隐宗','归元宗','栖霞山','玄都观'];
const RANKS=[{n:'外门弟子',need:0,pay:15},{n:'内门弟子',need:60,pay:30},{n:'真传弟子',need:250,pay:60},
  {n:'执事',need:800,pay:100},{n:'长老',need:2000,pay:160},{n:'太上长老',need:5000,pay:250}];
const JOBS=[{id:'j1',n:'洒扫山门',d:15*MIN,st:15,c:3},{id:'j2',n:'看守药园',d:HOUR,st:50,c:10},
  {id:'j3',n:'押送灵材',d:4*HOUR,st:170,c:32},{id:'j4',n:'镇守矿脉',d:8*HOUR,st:300,c:55}];
const ARTS={
  yinqi:{n:'引气诀',d:'修炼 +12%',from:'入门心法'},
  tuna:{n:'吐纳真解',d:'吐纳所得 +25%',from:'坊市有售'},
  jubao:{n:'聚宝诀',d:'灵石收入 +8%',from:'坊市有售'},
  changchun:{n:'长春功',d:'修炼 +6%，闭关上限 +2 小时',from:'宗门宝库，内门弟子可换'},
  taixu:{n:'太虚剑意',d:'冲关成算 +3%，修炼 +5%',from:'宗门宝库，真传弟子可换'}
};
const ART_MAX=9;
const PETS={
  fox:{n:'白狐',d:lv=>'探访机缘时气运 +'+(10+2*(lv-1))},
  luan:{n:'青鸾',d:lv=>'修炼 +'+(8+2*(lv-1))+'%'},
  shu:{n:'寻宝鼠',d:lv=>'灵石收入 +'+(10+3*(lv-1))+'%'},
  gui:{n:'玄龟',d:lv=>'冲关成算 +'+(5+(lv-1))+'%'},
  hu:{n:'赤焰虎',d:lv=>'吐纳所得 +'+(30+5*(lv-1))+'%'}
};
const PET_MAX=10;
const BOUNTIES={tap:{n:'吐纳',u:'次',g:[60,120]},cycle:{n:'周天圆满',u:'次',g:[5,10]},orb:{n:'采集灵气',u:'团',g:[3,5]},
  job:{n:'办结差事',u:'件',g:[1,2]},event:{n:'探访机缘',u:'道',g:[2,3]},habit:{n:'完成日课',u:'项',g:[1,2]},
  harvest:{n:'收取灵田',u:'次',g:[1,1]},boost:{n:'运功',u:'次',g:[2,3]},floor:{n:'闯过秘境',u:'层',g:[3,5]}};
const GEAR={
  rate:{n:'聚灵珠',v:.04,f:v=>'修炼 +'+Math.round(v*100)+'%'},
  stone:{n:'纳宝囊',v:.05,f:v=>'灵石收入 +'+Math.round(v*100)+'%'},
  tap:{n:'清心铃',v:.10,f:v=>'吐纳所得 +'+Math.round(v*100)+'%'},
  brk:{n:'护心镜',v:.02,f:v=>'冲关成算 +'+Math.round(v*100)+'%'},
  hp:{n:'玄铁甲',v:20,f:v=>'秘境气血 +'+Math.round(v)},
  def:{n:'青锋剑',v:.06,f:v=>'秘境所受伤害 −'+Math.round(v*100)+'%'},
  luck:{n:'转运玉',v:3,f:v=>'气运 +'+Math.round(v)}
};
const QUAL=[{n:'凡品',m:1},{n:'灵品',m:1.6},{n:'宝品',m:2.4},{n:'仙品',m:3.5}];
const DOOR={beast:{n:'兽吼之门',d:'门后有妖兽的腥气'},chest:{n:'藏珍之门',d:'门缝里透出宝光'},spring:{n:'水声之门',d:'隐约有泉水叮咚'},
  trap:{n:'无名之门',d:'门上没有任何记号'},sage:{n:'灯火之门',d:'似有人在里面煮茶'},boss:{n:'镇关石门',d:'威压自门后透出，此关躲不过'}};
const TRIALS=[
{x:'心魔化作你自己的模样，笑着问：“你今日的功课，是做给谁看的？”',a:[
  {l:'“做给明日的自己。”',c:{daily:1},v:.12,r:'心魔的笑僵在脸上，身形淡了三分。'},
  {l:'“谁也不给，做了便是。”',v:.04,r:'心魔撇撇嘴，退了半步。'},
  {l:'懒得答话，一剑斩去',risk:1,win:'剑光过处，幻影应声而碎。',lose:'一剑斩空，它在你身后轻笑。'}]},
{x:'幻境里是一张柔软的床榻，有个声音贴着耳朵说：“歇一天，不会怎样的。”',a:[
  {l:'“我已连着走了这些天，不差这一步。”',c:{streak:3},v:.12,r:'床榻化作飞灰。'},
  {l:'默数呼吸，等它自己散去',v:.04,r:'数到一百零八，那声音渐渐远了。'},
  {l:'躺上去，看它能如何',risk:1,win:'你躺得坦然，幻境反倒撑不住，自行崩解。',lose:'这一躺，险些没能起来。'}]},
{x:'眼前岔出一条捷径，路口立着石碑：此路省十年，代价不明。',a:[
  {l:'“我的路，是一天一天走出来的。”',c:{daily:2},v:.12,r:'石碑上的字迹一个个剥落。'},
  {l:'记下位置，仍走原路',v:.04,r:'你没有回头。'},
  {l:'踏上去试试',risk:1,win:'走了三步你便看穿是幻象，一脚踏碎。',lose:'脚下一空，你跌回原地，气息紊乱。'}]},
{x:'故人的脸一张张浮现，都在问同一句话：“你变强了，然后呢？”',a:[
  {l:'“然后护住该护的人。”',c:{rank:1},v:.12,r:'那些面孔笑了，一一散去。'},
  {l:'“还没想好，先走着。”',v:.04,r:'他们叹了口气，没有再问。'},
  {l:'闭目不答',risk:1,win:'不答亦是答，幻象无从下手。',lose:'那句话在你耳边绕了很久。'}]},
{x:'一个比你强出太多的身影俯视着你：“再练一百年，你也追不上我。”',a:[
  {l:'“我不追你，我追昨天的自己。”',c:{streak:7},v:.14,r:'那身影沉默良久，朝你拱了拱手。'},
  {l:'一笑置之',v:.04,r:'你笑了笑，它便小了一圈。'},
  {l:'拔剑相向',risk:1,win:'它根本接不住你一剑，原来是纸糊的。',lose:'你被震退数步，胸口发闷。'}]},
{x:'四周忽然极静，静到你听见念头一个个冒出来，全是没做完的事。',a:[
  {l:'“今日事，今日已毕。”',c:{all:1},v:.15,r:'念头如潮水退去，灵台一片空明。'},
  {l:'一件件记下，出关再办',v:.04,r:'记下之后，它们安分了些。'},
  {l:'强行压下所有念头',risk:1,win:'你竟真压住了，四下重归寂静。',lose:'越压越多，像按进水里的葫芦。'}]}
];

/* ---------- 机缘 ---------- */
const EVENTS=[
{id:'canhun',t:'洞中残魂',x:'山雨骤至，你躲进一处石洞。石壁后透出微光，一缕残魂缓缓凝形，自称三千年前的金丹修士：“小友，我以毕生所学，换你一个承诺。”',c:[
  {l:'应下承诺，听他讲道',o:[{w:7,g:1,x:'残魂大笑，一指点在你眉心。半卷功法烙入识海，他却始终没说那承诺是什么。',fx:{page:1,xp:20,flag:'nuo'}},{w:3,g:-1,x:'讲到一半，残魂忽然扑来，欲行夺舍。你拼力将其震散，神识却已受创。',fx:{demon:30}}]},
  {l:'恭敬一拜，转身离去',o:[{w:1,x:'你退出石洞，雨恰好停了。不取无名之物，心里反倒踏实。',fx:{luck:3,xp:5}}]},
  {l:'以道心镇之，先问来历',need:2,o:[{w:1,x:'你神色不动。残魂打量你许久，叹道：“今日已行过功课的人，骗不得。”遂倾囊相授。',fx:{page:2,xp:30}}]}]},
{id:'hulu',t:'坊市旧葫芦',x:'坊市尽头的地摊上，一只蒙尘的旧葫芦压在杂物底下。摊主眼皮都不抬：“祖传的，不讲价。”',c:[
  {l:'照价买下',cost:30,o:[{w:5,g:1,x:'回去一摇，葫芦里滚出两枚丹药，药香未散。',fx:{qi:2}},{w:3,x:'葫芦是空的，倒是可以拿来装水。',fx:{}},{w:2,g:1,x:'葫芦底嵌着一枚破境丹，不知是哪位前辈的私藏。',fx:{po:1}}]},
  {l:'蹲下来慢慢讲价',o:[{w:5,g:1,x:'磨了半个时辰，摊主烦不胜烦，半卖半送。葫芦里有一枚聚气丹。',fx:{qi:1}},{w:5,g:-1,x:'摊主一把收起葫芦：“不卖了。”',fx:{}}]},
  {l:'看看就走',o:[{w:1,x:'你起身离开。身后立刻有人蹲了下去。',fx:{luck:1}}]}]},
{id:'lingquan',t:'林中灵泉',x:'密林深处有一眼灵泉，灵气氤氲。泉边卧着一头酣睡的青鳞兽，鼻息如雷。',c:[
  {l:'屏息上前取水',o:[{w:6,g:1,x:'你舀了满满一壶，青鳞兽只翻了个身。泉水入腹，经脉一阵清凉。',fx:{xp:45}},{w:4,g:-1,x:'壶沿磕到石头，青鳞兽猛然睁眼。你一路狂奔下山，许久心神难定。',fx:{demon:25}}]},
  {l:'远远守着，等它离开',o:[{w:1,x:'日头偏西，青鳞兽才慢悠悠走了。泉水所剩不多，聊胜于无。',fx:{xp:15}}]}]},
{id:'shidi',t:'师弟借灵石',x:'同门师弟红着眼找上门：筑基丹只差最后一味药引，想借些灵石，“丹成之后必有重谢”。',c:[
  {l:'借给他',cost:20,o:[{w:7,g:1,x:'三日后师弟满面春风，塞给你一枚破境丹：“师兄，多炼了一炉。”',fx:{po:1}},{w:3,x:'炉炸了。师弟灰头土脸来赔罪，你摆摆手。这份情他会记着。',fx:{luck:5}}]},
  {l:'婉言谢绝',o:[{w:1,x:'师弟点点头走了。你继续打坐，却静不太下来。',fx:{xp:5}}]}]},
{id:'xinghe',t:'星河低垂',x:'今夜无云，星河低得像要落进山谷。你隐约觉得，天象在说些什么。',c:[
  {l:'静坐观星',o:[{w:8.5,x:'你看了一整夜，什么也没参透，气息却比平日绵长。',fx:{xp:25}},{w:1.5,g:1,x:'某颗星闪了三下，你脑中轰然一响，困扰多日的关窍豁然贯通。',fx:{xp:90}}]},
  {l:'推演自己的气运',o:[{w:6,g:1,x:'卦象显示：近日宜出门，宜动手，宜把拖着的事做完。',fx:{luck:5}},{w:4,g:-1,x:'卦象一片混沌，你越算越乱，索性作罢。',fx:{luck:-3}}]}]},
{id:'tanshe',t:'贪舍两门',x:'一座古修洞府，禁制早已残破。甬道尽头两扇石门，一扇刻着“贪”，一扇刻着“舍”。',c:[
  {l:'推开贪门',o:[{w:5,g:1,x:'满室灵石，无人看守。你装满了袖袋，石门在身后缓缓合上。',fx:{stone:120}},{w:5,g:-1,x:'门后是一座幻阵。你在金山银海里转了不知多久，出来时两手空空，心绪翻涌。',fx:{demon:45}}]},
  {l:'推开舍门，留下灵石为礼',cost:40,o:[{w:1,x:'石室空空，只有一方石台。你放下灵石，台上浮出两页功法，墨迹如新。',fx:{page:2,xp:30}}]}]},
{id:'huanxiang',t:'入定幻象',x:'入定之时，眼前浮出一个与你一模一样的人，懒洋洋开口：“今天那件事，明天再做也一样。”',c:[
  {l:'“今日的，已经做了。”',need:1,o:[{w:1,x:'幻象一怔，随即散作青烟。你心头一片澄明。',fx:{xp:60,luck:3}}]},
  {l:'与它辩个明白',o:[{w:6,g:1,x:'你一条条驳回去，幻象哑口无言。',fx:{xp:20}},{w:4,g:-1,x:'它句句在理，你竟无言以对。出定之后，杂念丛生。',fx:{demon:30}}]},
  {l:'点头称是',o:[{w:1,x:'幻象满意地笑了，递来几块灵石，像是定金。你隐约觉得亏了。',fx:{stone:10,demon:60}}]}]},
{id:'baihu',t:'受伤的白狐',x:'山道旁蜷着一只小白狐，后腿有伤，见了你也不逃，只是看着。',c:[
  {l:'买药替它治伤',cost:25,o:[{w:1,x:'白狐舔了舔你的手，跛着脚钻进草丛。翌日清晨，门前多了一株带露的灵草。',fx:{luck:8,qi:1,flag:'hu_en'}}]},
  {l:'留些干粮，继续赶路',o:[{w:1,x:'你走出很远回头，它还在原地望着。',fx:{luck:1}}]}]},
{id:'lundao',t:'道旁论道',x:'两位修士在道旁争得面红耳赤，一个说道在深山，一个说道在尘世。见你路过，齐声道：“你来评评。”',c:[
  {l:'以今日所行为证',need:1,o:[{w:1,x:'你说起今天做完的那件事。二人沉默片刻，各自拱手：“受教。”其中一人留下一页手札。',fx:{xp:55,page:1}}]},
  {l:'各打五十大板',o:[{w:1,x:'你说了些两边都不得罪的话。二人觉得无趣，接着吵去了。',fx:{xp:10}}]},
  {l:'旁听不语',o:[{w:1,x:'你听了半日，两边的道理都记下了一些。',fx:{xp:20}}]}]},
{id:'leiyu',t:'雷雨之夜',x:'子夜雷声大作，电光把群山照得雪亮。体修都说雷雨是淬体的良机，也有人就此没再下山。',c:[
  {l:'登上山顶，引雷淬体',o:[{w:4.5,g:1,x:'一道细雷擦身而过，你浑身酥麻，筋骨却像被洗过一遍。',fx:{xp:80}},{w:5.5,g:-1,x:'雷音贯耳，你眼前一黑。醒来已在山腰，耳中嗡鸣不止。',fx:{demon:40}}]},
  {l:'在屋里听雷',o:[{w:1,x:'你数着雷声入定，一夜安稳。',fx:{xp:20}}]}]},
{id:'lingzhi',t:'崖上灵芝',x:'百丈崖壁上长着一株灵芝，伞盖泛紫，少说三百年。崖下云雾翻涌，看不见底。',c:[
  {l:'攀崖去采',o:[{w:6,g:1,x:'你手脚并用爬了上去。灵芝到手，回去炼成两枚聚气丹。',fx:{qi:2}},{w:4,g:-1,x:'岩石松动，你摔进半山的树丛。人没事，钱袋不知掉去了哪里。',fx:{stone:-15}}]},
  {l:'记下位置，改日再来',o:[{w:1,x:'你在崖下刻了个记号。有些东西不急于一时。',fx:{luck:2}}]}]},
{id:'mifa',t:'筑基秘法',x:'茶肆角落，一个斗笠人压低声音：“前辈遗物，筑基秘法，只此一份。”',c:[
  {l:'掏灵石买下',cost:60,o:[{w:3.5,g:1,x:'竟是真货。匣中一枚破境丹，另有一页批注。',fx:{po:1,page:1}},{w:6.5,g:-1,x:'回去拆开一看，是《引气入门》的手抄本，还抄错了三处。',fx:{luck:-2,flag:'douli'}}]},
  {l:'喝完茶就走',o:[{w:1,x:'你放下茶钱。斗笠人已经在向邻桌兜售同一个匣子了。',fx:{luck:1}}]}]},
{id:'chaishi',t:'师门差事',x:'掌事长老翻着名册：“看守药园、押送灵材、藏经阁抄经，你挑一样。”',c:[
  {l:'看守药园',o:[{w:1,x:'一日无事。你数清了园里一共有多少株凝露草。',fx:{stone:35}}]},
  {l:'押送灵材',o:[{w:6.5,g:1,x:'一路顺遂，货主多给了赏钱。',fx:{stone:80}},{w:3.5,g:-1,x:'半道遇上劫修。你护住了货，赔进去自己的盘缠。',fx:{stone:-20}}]},
  {l:'藏经阁抄经',o:[{w:1,x:'抄到第三卷时，有几句话你停下来读了很多遍。',fx:{xp:30}}]}]},
{id:'canju',t:'石桌残局',x:'松下石桌，一位老者独对残局，头也不抬：“小友，替黑棋落一子。”',c:[
  {l:'落子天元',o:[{w:5,g:1,x:'老者抚掌大笑：“不拘一格，好。”他袖子一拂，一股暖流没入你的丹田。',fx:{xp:70}},{w:5,g:-1,x:'老者摇头：“花哨。”收了棋盘，飘然而去。',fx:{xp:10}}]},
  {l:'观棋不语',o:[{w:1,x:'你站着看完了整盘棋。老者临走时朝你点了点头。',fx:{xp:20,luck:2}}]}]},
{id:'liuhuo',t:'流火坠野',x:'夜半一道流火划过天际，坠入后山，隐隐有金铁之声。',c:[
  {l:'即刻去寻',o:[{w:4,g:1,x:'坑底一块陨铁尚有余温，坊市的铁匠出了高价。',fx:{stone:100}},{w:3,g:1,x:'陨坑里什么都没有，坑壁上却露出半页前人埋下的功法。',fx:{page:1}},{w:3,g:-1,x:'赶到时已围了十几个人，你连坑边都没挤进去。',fx:{}}]},
  {l:'不凑这个热闹',o:[{w:1,x:'你翻了个身接着打坐。第二天听说后山打了一夜。',fx:{xp:10}}]}]},
{id:'baidu',t:'渡口摆渡人',x:'渡口只有一条船。摆渡人说：“不收灵石，只问一句。你今日，可曾辜负光阴？”',c:[
  {l:'“未曾。”',need:1,o:[{w:1,x:'摆渡人看了你一眼，撑篙离岸。船到对岸时，你发觉丹田比上船前充盈了许多。',fx:{xp:45,luck:4}}]},
  {l:'“尚有亏欠。”',o:[{w:1,x:'摆渡人点头：“知道亏欠的，可以渡。”',fx:{xp:20}}]},
  {l:'沉默不答',o:[{w:1,x:'船还是开了，只是一路无话。',fx:{xp:5}}]}]},
{id:'luhuo',t:'炉火转青',x:'炼到紧要处，炉火忽然由赤转青。丹书上说这是异变，没说是吉是凶。',c:[
  {l:'加大火力，赌一把',o:[{w:5,g:1,x:'炉盖掀开，一枚破境丹滴溜溜打转。',fx:{po:1}},{w:5,g:-1,x:'轰的一声，炉子裂了。修炉的钱不便宜。',fx:{stone:-15}}]},
  {l:'收火保丹',o:[{w:1,x:'你稳稳收了火，得了一枚寻常的聚气丹。',fx:{qi:1}}]}]},
{id:'laixin',t:'故人来信',x:'凡俗的故友托人捎来一封信，说了些家长里短，末尾问：“你去修仙，到底求的是什么？”',c:[
  {l:'提笔回信',o:[{w:1,x:'你写了很久，写完才发现是写给自己的。搁笔时，心中再无滞碍。',fx:{xp:20,clear:1}}]},
  {l:'先放着，日后再回',o:[{w:1,x:'信压在蒲团底下，偶尔硌你一下。',fx:{xp:10}}]}]},
{id:'mijing',t:'小秘境开启',x:'百年一开的小秘境三日后开启，宗门只有五个名额，报名要缴一笔灵石。',c:[
  {l:'缴灵石，争名额',cost:50,o:[{w:6,g:1,x:'你抢到了名额，在秘境里寻到一处灵眼，足足坐了三天。',fx:{xp:120,stone:60}},{w:4,x:'名额到手，秘境里却被人抢先一步，只捡了些边角。',fx:{xp:40}}]},
  {l:'把机会让给同门',o:[{w:1,x:'师姐拿到了最后一个名额，临行前郑重向你道谢。',fx:{luck:6}}]}]},
{id:'gujing',t:'阁中古镜',x:'藏宝阁的角落立着一面古镜，据说能照见十年后的自己。',c:[
  {l:'走近细看',o:[{w:5,g:1,x:'镜中人立于峰顶，回头冲你笑了一下。',fx:{xp:40}},{w:5,g:-1,x:'镜中人伏案昏睡，四周积着厚厚的灰。你退了半步，心里发紧。',fx:{demon:20,luck:3}}]},
  {l:'把镜子扣过去',o:[{w:1,x:'十年后的事，十年后再看。',fx:{xp:10}}]}]},
{id:'xiaobi',t:'外门小比',x:'宗门小比，擂台上只剩你和一位师兄。台下的长老端着茶，看不出喜怒。',c:[
  {l:'全力以赴',o:[{w:5.5,g:1,x:'三十招后师兄的剑脱了手。长老放下茶盏，在名册上记了一笔。',fx:{contrib:15,stone:40}},{w:4.5,g:-1,x:'你输了半招，下台时听见有人轻笑，心里堵得慌。',fx:{contrib:5,demon:15}}]},
  {l:'点到为止',o:[{w:1,x:'你们打了个平手，相视一笑。长老点了点头。',fx:{contrib:6,luck:2}}]}]},
{id:'shandan',t:'石缝里的蛋',x:'山涧边，一枚带斑纹的蛋卡在石缝里，蛋壳尚温，四下不见母兽。',c:[
  {l:'揣进怀里带回洞府',o:[{w:5,g:1,x:'你用灵气温养了三日，蛋壳上亮起一圈细纹。',fx:{egg:1}},{w:5,x:'孵出来是只山鸡。它在洞府里住下了，每天清晨准时打鸣。',fx:{luck:2}}]},
  {l:'守到母兽回来',o:[{w:1,x:'黄昏时一只青羽大鸟落下，衔走了蛋，临走丢下一根尾羽。',fx:{luck:6,stone:20}}]}]},
{id:'hantian',t:'灵田久旱',x:'连日无雨，灵田里的凝露草打了蔫。隔壁洞府的师兄已经在挑水了。',c:[
  {l:'买灵泉水来浇',cost:20,o:[{w:1,x:'一担灵泉水下去，凝露草一夜之间直起了腰，收成比往常还好。',fx:{stone:70}}]},
  {l:'听天由命',o:[{w:5,g:1,x:'后半夜落了一场透雨。',fx:{stone:30}},{w:5,g:-1,x:'又晒了三天，草枯了一半。',fx:{}}]}]},
{id:'cangjing',t:'藏经阁开阁',x:'藏经阁三层今日对内门以上弟子开放。守阁老人靠着门框打盹，腰牌挂在手指上晃。',c:[
  {l:'亮出腰牌，上三层',rank:1,o:[{w:1,x:'三层的书都用禁制封着，你只来得及抄下两页，已是受用不尽。',fx:{page:2}}]},
  {l:'在一层翻旧书',o:[{w:7,x:'旧书里夹着前人的批注，字迹潦草，道理却实在。',fx:{xp:20}},{w:3,g:1,x:'一本《山川志》的封皮里，夹着一页不相干的功法。',fx:{page:1,xp:10}}]}]},

function hydrate(raw,now){

  }
  s.inv=Object.assign({qi:0,po:0,food:0,key:0},s.inv);

  if(!Array.isArray(s.gear))s.gear=[];
  if(!s.bounty||!Array.isArray(s.bounty.list))s.bounty={day:'',list:[],bonus:false};
  if(!s.dg||typeof s.dg!=='object')s.dg={day:'',n:0};
  if(typeof s.draws!=='number')s.draws=0;
  if(!s.arts||typeof s.arts!=='object')s.arts={yinqi:1};
  if(!s.arts[s.mainArt])s.mainArt=Object.keys(s.arts)[0]||'yinqi';
  if(!s.pets||typeof s.pets!=='object')s.pets={};
  if(s.pet&&!s.pets[s.pet])s.pet='';

  if(!s.shop||typeof s.shop!=='object')s.shop={day:'',fate:0,page:0};

/* ---------- cultivation maths ---------- */
function rankIdx(){let r=0;for(let i=0;i<RANKS.length;i++)if(S.sectTotal>=RANKS[i].need)r=i;return r;}
function artLv(id){return (S.arts[id]||0)*(S.mainArt===id?1.5:1);}
function eff(){
  const p=S.pet&&S.pets[S.pet]?S.pets[S.pet].lv:0,is=id=>p>0&&S.pet===id;
  const acc={rate:0,stone:0,tap:0,brk:0,luck:0,hp:0,def:0};
  for(const a of ACHS)if(S.ach[a.id])for(const k in a.e)acc[k]+=a.e[k];
  for(const g of S.gear)if(g.on&&GEAR[g.t])acc[g.t]+=gearVal(g);
  return {
    rate:(1+.12*artLv('yinqi')+.06*artLv('changchun')+.05*artLv('taixu'))*(1+.04*rankIdx())*(is('luan')?1.08+.02*(p-1):1)*(1+acc.rate),
    stone:1+.08*artLv('jubao')+(is('shu')?.10+.03*(p-1):0)+acc.stone,
    tap:1+.25*artLv('tuna')+(is('hu')?.30+.05*(p-1):0)+acc.tap,
    brk:.03*artLv('taixu')+(is('gui')?.05+.01*(p-1):0)+acc.brk,
    luck:(is('fox')?10+2*(p-1):0)+acc.luck,
    cap:DAY+2*HOUR*artLv('changchun'),
    hp:Math.round(100+10*rankIdx()+acc.hp),
    def:Math.min(.6,acc.def)
  };
}
function streakNow(t){return t<S.streakUntil?S.streak:0;}
function bonuses(t){
  const b=branchIdx(t),out=[],root=ROOTS[S.root.el];
  if(CARDINAL.includes(b))out.push({l:BRANCH[b]+'时四正',v:.25});
  if(root.br.includes(b))out.push({l:S.root.el+'灵根应时',v:root.bonus});
  if(t<S.dailyUntil&&S.dailyCount)out.push({l:'今日日课 '+S.dailyCount+' 项',v:.1*S.dailyCount});
  const st=streakNow(t);if(st)out.push({l:'道心 · 连续 '+st+' 日',v:Math.min(st,20)*.03});
  return out;
}
function rateAt(t){
  const add=bonuses(t).reduce((a,x)=>a+x.v,0);
  let r=Math.pow(1.3,S.stage)*GRADES[S.root.g].m*(1+.15*S.array)*(1+.5*S.asc)*eff().rate*(1+add);
  if(t<S.teaUntil)r*=1.5;
  if(t<S.boostUntil)r*=2;
  if(t<S.demonUntil)r*=.75;
  return r;
}
const atWall=()=>STAGES[S.stage].last&&S.xp>=req(S.stage);
function stageUp(t){S.stage++;S.xp=0;log('水到渠成，踏入'+STAGES[S.stage].name+'。','key',t);}
function hitWall(t){if(!S.stuck){S.stuck=true;log('修为已至'+STAGES[S.stage].name+'瓶颈，再坐无益，需亲手冲关。','key',t);return true;}return false;}
function advance(to){
  const res={xp:0,ups:0,fate:0,wall:false,capped:false},cap=eff().cap;
  if(to-S.ts>cap){S.ts=to-cap;res.capped=true;}
  let guard=0;
  while(S.ts<to&&guard++<800){
    let end=Math.min(to,nextBranch(S.ts));
    for(const k of ['dailyUntil','streakUntil','demonUntil','teaUntil','boostUntil'])if(S[k]>S.ts&&S[k]<end)end=S[k];
    const need=req(S.stage)-S.xp,last=STAGES[S.stage].last;
    if(need<=0&&last){if(hitWall(S.ts))res.wall=true;S.ts=end;continue;}
    const r=rateAt(S.ts),gain=r*(end-S.ts)/1000;
    if(gain>=need){
      res.xp+=need;
      if(last){S.xp=req(S.stage);if(hitWall(S.ts))res.wall=true;S.ts=end;}
      else{const hit=Math.min(end,Math.ceil(S.ts+need/r*1000));stageUp(hit);S.ts=Math.max(hit,S.ts+1);res.ups++;}
    }else{S.xp+=gain;res.xp+=gain;S.ts=end;}
  }
  if(S.fate<FATE_CAP){
    if(!S.fateAt)S.fateAt=to+FATE_INT;
    while(S.fate<FATE_CAP&&S.fateAt<=to){S.fate++;res.fate++;S.fateAt+=FATE_INT;}
  }
  if(S.fate>=FATE_CAP)S.fateAt=0;
  if(to>=S.streakUntil&&S.streak)S.streak=0;
  const today=dayKey(to);
  if(S.done.day!==today)S.done={day:today,ids:[]};
  if(S.shop.day!==today)S.shop={day:today,fate:0,page:0};
  if(S.bounty.day!==today)rollBounty(today);
  if(S.dg.day!==today)S.dg={day:today,n:0};
  return res;
}
function addXp(amt,now){
  S.xp+=amt;
  while(S.xp>=req(S.stage)){
    if(STAGES[S.stage].last){S.xp=req(S.stage);hitWall(now);break;}
    const over=S.xp-req(S.stage);stageUp(now);S.xp=over;
  }
}

function applyFx(fx,now){

  if(fx.clear&&now<S.demonUntil){S.demonUntil=0;g.push({x:'心魔已破',up:1});}
  return g;
}

function settleRun(now,dead){

function trialOk(c,now){
  if(!c)return{ok:true,note:''};
  const d=S.done.ids.length;
  if(c.daily)return{ok:d>=c.daily,note:'需今日完成 '+c.daily+' 项日课，现为 '+d+' 项'};
  if(c.all)return{ok:d>=S.habits.length,note:'需今日功课全部做完，现为 '+d+' / '+S.habits.length};
  if(c.streak)return{ok:streakNow(now)>=c.streak,note:'需日课连续 '+c.streak+' 日，现为 '+streakNow(now)+' 日'};
  if(c.rank)return{ok:rankIdx()>=c.rank,note:'需'+RANKS[c.rank].n+'以上身份'};

}
function startTrial(){
  const now=Date.now();advance(now);if(!atWall())return;
  const pool=TRIALS.map((_,i)=>i),qs=[];
  while(qs.length<3)qs.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  ui.trial={qs,i:0,mod:0,last:''};renderTrial();
}
function renderTrial(){
  const T=ui.trial,now=Date.now();if(!T)return;
  const base=breakOdds(now),c=clamp(base.c+T.mod,.05,.95);
  let h='';
  if(T.i<3){
    const q=TRIALS[T.qs[T.i]];
    h+='<h3>心魔劫 · 第'+'一二三'[T.i]+'问</h3>'+(T.last?'<p class="picked">'+esc(T.last)+'</p>':'')+'<p class="story">'+esc(q.x)+'</p><div class="choices">';
    q.a.forEach((a,k)=>{
      const s=trialOk(a.c,now),tag=a.risk?'险招：成则 +15%，败则 −10%':(a.c?(s.ok?'道心所系，成算 +'+pct(a.v):s.note):'稳妥，成算 +'+pct(a.v));
      h+='<button class="choice" type="button" data-act="trialAns" data-k="'+k+'"'+(s.ok?'':' disabled')+'><span>'+esc(a.l)+'</span><small>'+esc(tag)+'</small></button>';
    });
    h+='</div><p class="hint">眼下成算 '+Math.round(c*100)+'%。答完三问才见分晓，中途退出不耗丹药。</p><button class="btn" type="button" data-act="closeSheet">暂不冲关</button>';
  }else{
    h+='<h3>三问已过</h3>'+(T.last?'<p class="picked">'+esc(T.last)+'</p>':'')+'<p class="story">幻象散尽，关隘就在眼前。成算 '+Math.round(c*100)+'%'+(base.pills?'，将服破境丹 '+base.pills+' 枚':'')+'。</p>'+
      '<div class="acts"><button class="btn gold" type="button" data-act="trialGo">冲关</button><button class="btn" type="button" data-act="closeSheet">再等等</button></div>';
  }
  sheet(h,true);
}
function answerTrial(k){
  const T=ui.trial,now=Date.now();if(!T||T.i>=3)return;
  const a=TRIALS[T.qs[T.i]].a[k];if(!a||!trialOk(a.c,now).ok)return;
  if(a.risk){const win=Math.random()<.5;T.mod+=win?.15:-.1;T.last=(win?a.win:a.lose)+'（成算 '+(win?'+15%':'−10%')+'）';}
  else{T.mod+=a.v;T.last=a.r+'（成算 +'+pct(a.v)+'）';}

}

/* ---------- cloud save (per-viewer document) ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const timeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),ms))]);
async function initCloud(){
  try{
    if(!window.claude||typeof window.claude.use!=='function')return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    cloud.ref=db.doc('data/users/'+uid+'/save');
    const adopted=await pullCloud(true);
    cloud.ready=true;cloud.state='synced';
    if(!adopted&&!fresh)pushCloud();
  }catch(e){cloud.state='local';}
  finally{if(ui.tab==='fu'&&!editing())renderPanel();}
}
async function pullCloud(first){
  if(!cloud.ref)return false;
  try{
    const snap=await timeout(cloud.ref.get(),10000);
    if(!snap.exists)return false;
    const r=JSON.parse(JSON.stringify(snap.data()));
    if(!valid(r))return false;
    const newer=first?(fresh||(r.savedAt||0)>loadedSavedAt):(r.savedAt||0)>(S.savedAt||0);
    if(!newer)return false;
    const now=Date.now(),before=r.ts;
    S=hydrate(r,now);fresh=false;loadedSavedAt=S.savedAt||0;
    const res=advance(now);saveLocal();render();
    if(now-before>5*MIN)offlineSheet(now-before,res);
    return true;
  }catch(e){return false;}
}
async function pushCloud(){
  if(!cloud.ref||!cloud.ready)return;
  cloud.dirty=true;if(cloud.busy)return;cloud.busy=true;
  while(cloud.dirty){
    cloud.dirty=false;
    const body=JSON.parse(JSON.stringify(S));
    try{await cloud.ref.set(body);cloud.state='synced';}
    catch(e){
      if(e&&e.code==='unavailable'){await sleep(1500+Math.random()*1500);try{await cloud.ref.set(body);cloud.state='synced';}catch(e2){cloud.state='local';}}
      else cloud.state='local';
    }
    await sleep(1200);
  }
  cloud.busy=false;
}

/* ---------- painting ---------- */
let paintKey='';
function paint(now,force){
  const c=$('#scene'),w=c.clientWidth,h=c.clientHeight;if(!w||!h)return;
  const d=new Date(now),key=document.documentElement.dataset.phase+Math.floor((d.getHours()*60+d.getMinutes())/10)+w+'x'+h;
  if(key===paintKey&&!force)return;paintKey=key;
  const dpr=Math.min(window.devicePixelRatio||1,2);c.width=w*dpr;c.height=h*dpr;
  const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
  const css=getComputedStyle(document.documentElement),v=n=>css.getPropertyValue(n).trim();
  const sky=g.createLinearGradient(0,0,0,h);sky.addColorStop(0,v('--sky1'));sky.addColorStop(1,v('--sky2'));
  g.fillStyle=sky;g.fillRect(0,0,w,h);
  const hr=d.getHours()+d.getMinutes()/60,day=isDay(now);
  if(!day){ // fixed stars
    let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
    g.fillStyle=v('--ink');
    for(let i=0;i<46;i++){const x=rnd()*w,y=rnd()*h*.55,r=rnd()*1.1+.3;g.globalAlpha=.25+rnd()*.5;g.beginPath();g.arc(x,y,r,0,7);g.fill();}
    g.globalAlpha=1;
  }
  const p=day?(hr-5)/14:((hr-19+24)%24)/10;
  const bx=w*(.3+.6*p),by=h*(.5-Math.sin(Math.PI*p)*.36);
  g.fillStyle=day?v('--cinnabar'):v('--ink');g.globalAlpha=day?.85:.9;
  g.beginPath();g.arc(bx,by,day?13:11,0,7);g.fill();g.globalAlpha=1;
  const tri=u=>1-Math.abs(Math.sin(u));
  const layers=[
    {b:.66,s:.32,a:.20,n:2.3,p:.4,c:'--m1',al:.75},
    {b:.78,s:.30,a:.17,n:3.1,p:1.7,c:'--m2',al:1,gold:1},
    {b:.90,s:.22,a:.13,n:4.3,p:.9,c:'--m3',al:1,gold:1},
    {b:1.0,s:.10,a:.09,n:5.6,p:2.6,c:'--m4',al:1}];
  for(const L of layers){
    const y=x=>{const u=x/w;return h*(L.b-L.s*u)-h*L.a*(.6*tri(Math.PI*u*L.n+L.p)+.28*tri(Math.PI*u*L.n*2.3+L.p*2)+.12*Math.sin(u*31+L.p));};
    g.beginPath();g.moveTo(0,h);for(let x=0;x<=w;x+=2)g.lineTo(x,y(x));g.lineTo(w,h);g.closePath();
    g.globalAlpha=L.al;g.fillStyle=v(L.c);g.fill();
    if(L.gold){g.beginPath();for(let x=0;x<=w;x+=2)x?g.lineTo(x,y(x)):g.moveTo(x,y(x));g.globalAlpha=.55;g.strokeStyle=v('--gold');g.lineWidth=1;g.stroke();}
    g.globalAlpha=1;
  }
  const mist=g.createLinearGradient(0,h-26,0,h);mist.addColorStop(0,'rgba(0,0,0,0)');mist.addColorStop(1,v('--bg'));
  g.fillStyle=mist;g.fillRect(0,h-26,w,26);
}
function setPhase(now){
  const ph=isDay(now)?'day':'night';
  if(document.documentElement.dataset.phase!==ph){document.documentElement.dataset.phase=ph;paint(now,true);}else paint(now);
}

/* ---------- wiring ---------- */
function wire(){
  document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b)setTab(b.dataset.tab);});
  $('#breakBtn').addEventListener('click',startTrial);
  $('#boostBtn').addEventListener('click',doBoost);
  $('.hero').addEventListener('click',e=>{const r=e.currentTarget.getBoundingClientRect();breathe(e.clientX-r.left,e.clientY-r.top);});
  $('#sheet').addEventListener('click',e=>{
    const b=e.target.closest('[data-act]'),a=b&&b.dataset.act;
    if(e.target.id==='sheet'||a==='closeSheet'){$('#sheet').hidden=true;ui.trial=null;return;}
    if(!b||b.disabled)return;
    if(a==='trialAns')answerTrial(+b.dataset.k);
    else if(a==='trialGo'){const m=ui.trial?ui.trial.mod:0;ui.trial=null;$('#sheet').hidden=true;doBreak(m);}
  });
  $('#panel').addEventListener('click',e=>{
    const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,d=b.dataset;
    if(a==='tab')setTab(d.tab);
    else if(a==='seg'){ui[d.grp]=d.seg;ui.editName=false;ui.confirmReset=false;renderPanel();$('#panel').scrollTop=0;}
    else if(a==='bounty')claimBounty(+d.i);
    else if(a==='dgEnter')enterRun();
    else if(a==='dgDoor')openDoor(+d.i);
    else if(a==='dgNext')goDeeper();
    else if(a==='dgLeave')leaveRun();
    else if(a==='gearToggle')toggleGear(+d.i);
    else if(a==='gearMelt')meltGear(+d.i);
    else if(a==='done')doneHabit(d.id);
    else if(a==='draw')drawEvent();
    else if(a==='choose')choose(+d.i);
    else if(a==='usePill')usePill();
    else if(a==='buy')buy(d.k);
    else if(a==='upgrade')upgrade(d.what);
    else if(a==='harvest')harvest();
    else if(a==='pay')claimPay();
    else if(a==='job')takeJob(d.id);
    else if(a==='turnIn')turnInJob(+d.i);
    else if(a==='redeem')redeem(d.k);
    else if(a==='donate')donate();
    else if(a==='study')studyArt(d.id);
    else if(a==='mainArt')act(()=>{if(S.arts[d.id])S.mainArt=d.id;});
    else if(a==='feed')feedPet(d.id);
    else if(a==='setPet')act(()=>{if(S.pets[d.id])S.pet=d.id;});
    else if(a==='editHabits'){ui.draft=JSON.parse(JSON.stringify(S.habits));ui.editHabits=true;renderPanel();}
    else if(a==='cancelHabits'){ui.editHabits=false;ui.draft=null;renderPanel();}
    else if(a==='addHabit'){readHabitInputs();ui.draft.push({id:'h'+Date.now().toString(36),name:'新课',desc:''});renderPanel();}
    else if(a==='delHabit'){readHabitInputs();ui.draft.splice(+d.i,1);renderPanel();}
    else if(a==='saveHabits'){readHabitInputs();const dr=ui.draft;ui.editHabits=false;ui.draft=null;act(()=>{S.habits=dr;S.done.ids=S.done.ids.filter(i=>dr.some(x=>x.id===i));});}
    else if(a==='editName'){ui.editName=true;renderPanel();const i=$('#nameInput');if(i)i.focus();}
    else if(a==='saveName'){const v=($('#nameInput').value||'').trim().slice(0,8);ui.editName=false;act(()=>{if(v)S.name=v;});}
    else if(a==='resetAsk'){ui.confirmReset=true;renderPanel();}
    else if(a==='resetNo'){ui.confirmReset=false;renderPanel();}
    else if(a==='resetYes'){ui.confirmReset=false;const now=Date.now();S=newGame(now);fresh=false;advance(now);S.savedAt=now;saveLocal();pushCloud();ui.seg='dong';ui.yseg='qi';ui.zseg='shi';setTab('xiu');}
  });
  window.addEventListener('resize',()=>paint(Date.now(),true));
  document.addEventListener('visibilitychange',async()=>{
    if(document.hidden){saveLocal();return;}
    const pulled=cloud.ready?await pullCloud(false):false;
    if(!pulled){const now=Date.now(),before=S.ts,res=advance(now);if(!editing())render();else updateLive(now);if(now-before>30*MIN)offlineSheet(now-before,res);}
  });
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>paint(Date.now(),true));
}
let lastLocal=0,lastAmbient=Date.now(),nextOrb=Date.now()+9000;
function tick(){
  const now=Date.now(),res=advance(now);
  setPhase(now);
  let dirty=res.ups||res.fate||res.wall||liveKey(now)!==ui.liveKey;
  if(checkAch(now)){dirty=true;S.savedAt=now;saveLocal();pushCloud();}
  if(now-lastAmbient>5*MIN&&!S.stuck){lastAmbient=now;log(pick(AMBIENT),'',now);dirty=dirty||ui.tab==='xiu';}
  if(dirty&&!editing())renderPanel();
  updateLive(now);
  if(!document.hidden&&now>=nextOrb){nextOrb=now+25000+Math.random()*20000;if(document.querySelectorAll('.orb').length<2)spawnOrb();}
  if(now-lastLocal>15000){lastLocal=now;saveLocal();}
}
function start(hot){
  const now=Date.now(),local=loadLocal();
  if(valid(hot)){S=hydrate(hot,now);loadedSavedAt=S.savedAt||0;}
  else if(valid(local)){S=hydrate(local,now);loadedSavedAt=S.savedAt||0;}
  else{S=newGame(now);fresh=true;}
  const before=S.ts,res=advance(now);
  wire();document.documentElement.dataset.phase=isDay(now)?'day':'night';
  render();paint(now,true);
  if(!fresh&&now-before>5*MIN)offlineSheet(now-before,res);
  setInterval(tick,1000);
  initCloud();
}
const hotApi=window.claude&&window.claude.hot;
if(hotApi&&typeof hotApi.snapshot==='function')hotApi.snapshot(()=>JSON.parse(JSON.stringify(S)));
if(hotApi&&typeof hotApi.ready==='function')hotApi.ready(start);else start((hotApi&&hotApi.data)||{});
})();

</script>
